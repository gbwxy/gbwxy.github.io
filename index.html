<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <title>gbwxy-blogs</title>
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
   <meta name="description" content="">
   <title></title>

  <!-- Themes (light + dark) -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <!-- Custom Styles -->
  <style>
     img {
       max-width: 100%;
       max-height: 400px; /* 或者你想要的最大高度 */
       display: block; /* 让图片独占一行 */
       margin: 0 auto; /* 居中图片 */
     }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // Docsify Configuration
    window.$docsify = {
       name: '隔壁王小猿的博客',
       repo: 'https://github.com/gbwxy/blogs',
       maxLevel: 8,//最大支持渲染的标题层级
       subMaxLevel: 0,
       homepage: 'README.md',
       coverpage: false,
       loadSidebar: true,
       loadNavbar: true,
       auto2top: true,//切换页面后是否自动跳转到页面顶部
       toc: true,
       tocFolat: true
    }
  </script>

  <!-- Docsify core -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
</body>
</html>
